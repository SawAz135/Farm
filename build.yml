name: Build FarmChestAuto

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Theos
        uses: waruhachi/theos-action@v1
      - name: Build
        run: make FINALPACKAGE=1
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: FarmChestAuto.dylib
          path: .theos/obj/FarmChestAuto.dylib
